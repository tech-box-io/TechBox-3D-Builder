<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Instructions</title>
<link rel="icon" href="data:,">
<script>
// Hosted, a guide is the folder /<guide>/ (its index.html is this page): opened without the closing slash, the browser would look
// for the guide's files one folder up, so add it before anything loads. (Locally the page is player.html, and nothing changes.)
if (!/(\/|\.html?)$/i.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
</script>
<style>
:root{--blue:#1a9fd9;--ink:#111;--bar:#fff;--barh:86px;--caution:#c2410c}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#fff;font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden;color:var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* keyboard focus: a dark ring, outside the control so it shows on the blue buttons too */
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #111;outline-offset:3px}
#stage{position:fixed;inset:0 0 var(--barh) 0}
#stage canvas{display:block}
#stage canvas:focus-visible{outline-offset:-4px}
#overlay{position:fixed;left:0;top:0;width:100%;height:calc(100% - var(--barh));pointer-events:none}
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--barh);display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--bar);box-sizing:border-box}
.rb{border:0;background:var(--blue);color:#fff;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.rb.big{width:58px;height:58px}.rb.sm{width:36px;height:36px}
.rb:disabled{opacity:.35;cursor:default}
.rb svg{fill:#fff}
#gridbtn{background:none;border:0;cursor:pointer;padding:4px;flex:none}
select{flex:1;min-width:0;height:44px;font-size:20px;font-weight:600;color:#55606a;text-align:center;text-align-last:center;border:1px solid #d5dbe0;border-radius:6px;background:#fff}
#fs{position:fixed;top:14px;right:14px;background:none;border:0;cursor:pointer;z-index:5}
#resetview{position:fixed;top:14px;right:54px;background:none;border:0;cursor:pointer;z-index:5}
.nofs #resetview{right:14px}.nofs #review{right:56px}
@media (min-width:701px){.reviewing #instructions{max-width:min(560px,70vw,calc(100vw - 236px))}}   /* (below 701 px the caption is under the buttons) */
#start{position:fixed;left:24px;top:24px;bottom:calc(var(--barh) + 24px);width:min(46%,520px);display:flex;flex-direction:column;justify-content:center;pointer-events:none}
#logo{position:absolute;top:0;left:0;background:#00b0ef;color:#fff;font:900 34px/1 Impact,"Arial Black",sans-serif;letter-spacing:1px;padding:10px 18px;border-radius:12px}
#logo.image{position:static;background:none;padding:0;border-radius:0;width:min(100%,360px);margin:0 0 18px}
#logo.image img{display:block;width:100%;height:auto}
#start h1{font:800 34px/1.1 "Arial Narrow",Arial,sans-serif;margin:0;color:#585858}
#start h2{font:700 18px Arial;margin:4px 0 6px;color:#585858}
#start small{font-size:11px;color:#333}
/* the step's instructions: a box, with a button that reads them aloud; a caution under it when the step has one */
#instructions{position:fixed;left:16px;top:14px;max-width:min(560px,70vw);display:flex;flex-direction:column;gap:8px;z-index:3}
#caption{display:flex;align-items:flex-start;gap:10px;background:rgba(255,255,255,.94);border:2px solid var(--blue);border-radius:10px;padding:8px 8px 8px 14px;font-size:18.4px;line-height:1.35}
#captiontext{margin:0;flex:1;padding-top:3px}
.speak{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:var(--blue);cursor:pointer;display:grid;place-items:center;padding:0}
.speak svg{fill:#fff;width:20px;height:20px}
.speak .stop{display:none}.speak[aria-pressed="true"] .stop{display:block}.speak[aria-pressed="true"] .say{display:none}
.caution{display:flex;align-items:flex-start;gap:10px;background:#fff4e6;border:2px solid var(--caution);border-radius:10px;padding:8px 12px;font-size:17px;line-height:1.35}
.caution svg{flex:none;width:26px;height:24px;margin-top:1px}
.caution p{margin:0}
.caution strong{color:#9a3412}
#flag{position:fixed;left:16px;bottom:calc(var(--barh) + 14px);max-width:min(520px,80vw);background:#fff7d6;border:1px solid #e3c54a;padding:7px 10px;font-size:13px;line-height:1.35}
#card{position:fixed;inset:0 0 var(--barh) 0;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);place-items:center;pointer-events:none}
#cardbox{position:relative;max-width:560px;margin:0 16px;border:3px solid var(--blue);border-radius:14px;padding:28px 56px 28px 32px;background:#fff;box-sizing:border-box;max-height:calc(100% - 16px);overflow:auto;pointer-events:auto;display:flex;flex-direction:column;gap:14px}
#cardtext{font-size:24px;line-height:1.4;text-align:center;white-space:pre-line}
#cardbox.list{max-width:760px}#cardbox.list #cardtext{text-align:left;font-size:20px}
#cardspeak{position:absolute;top:12px;right:12px}
/* the parts list (a page of its own after the title page), styled after the published guides: one band per part */
#partsview{position:fixed;inset:0 0 var(--barh) 0;overflow:auto;padding:22px 24px 24px;box-sizing:border-box;background:#fff}
#partsview h2{font:700 22px Arial,sans-serif;color:#55606a;margin:0 0 14px}
#partsgroups{display:flex;flex-wrap:wrap;gap:26px 40px;align-items:flex-start}
.pgroup{flex:1 1 300px;max-width:640px;min-width:min(300px,100%)}
.pgroup h3{display:flex;align-items:center;gap:10px;margin:0 0 10px;font:700 16px Arial,sans-serif;color:#333}
.pgroup h3 svg{width:40px;height:40px;flex:none}
.pgroup ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px 18px}
.pgroup li{list-style:none}
.pband{position:relative;display:flex;align-items:center;width:100%;height:46px;margin:10px 0;border:0;border-radius:23px 0 0 23px;background:var(--band);padding:0 96px 0 12px;font:inherit;color:inherit;text-align:left;cursor:zoom-in}
.pband:hover{filter:brightness(.97)}
.pqty{font:700 20px Arial,sans-serif;min-width:44px}
.pname{display:flex;flex-direction:column;align-items:flex-start;gap:2px;font:13px/1.15 Arial,sans-serif;color:#222}
.ptag{background:#333;color:#fff;font:700 11px/1 Arial,sans-serif;padding:2px 6px;border-radius:7px}
.pband img{position:absolute;right:0;top:50%;width:92px;height:92px;transform:translateY(-50%);object-fit:contain;filter:drop-shadow(0 0 1.5px var(--halo)) drop-shadow(0 0 1.5px var(--halo)) drop-shadow(0 0 1px var(--halo))}
/* a part's picture, large (a click on its band in the parts list) */
#partzoom{position:fixed;inset:0 0 var(--barh) 0;z-index:8;background:rgba(40,44,48,.55);display:grid;place-items:center;padding:16px;box-sizing:border-box}
#partzoom figure{position:relative;margin:0;background:#fff;border-radius:14px;padding:18px 18px 12px;box-sizing:border-box;max-width:100%;max-height:100%;display:flex;flex-direction:column;align-items:center}
#partzoom img{display:block;width:min(500px,calc(100vw - 68px),calc(100vh - var(--barh) - 120px));height:auto;aspect-ratio:1/1;object-fit:contain}
#partzoom figcaption{font:700 18px Arial,sans-serif;color:#222;padding-top:6px;text-align:center}
#partzoomclose{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:#111;color:#fff;font-size:22px;line-height:1;cursor:pointer}
/* a close-up picture with a lead line to the place it shows (e.g. inside a part, as if one part were not there) */
#inset{position:fixed;z-index:2;margin:0;background:#fff;border:4px solid #7fdbff;border-radius:12px;padding:6px;box-sizing:border-box;pointer-events:none}
#inset img{display:block;width:100%;height:auto;border-radius:6px}
#inset figcaption{font:600 14px/1.3 Arial,sans-serif;color:#333;text-align:center;padding-top:4px}
#review{position:fixed;top:14px;right:96px;font-size:12px;color:#555;z-index:5;background:#fff;padding:4px 6px;border-radius:6px}
#picks{position:fixed;right:16px;bottom:calc(var(--barh) + 14px);z-index:4;max-width:min(560px,80vw);background:#111;color:#fff;border-radius:6px;padding:8px 10px;font-size:12px}
#picklist{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;user-select:text;max-height:30vh;overflow:auto;margin:4px 0 6px}
#picks button{border:0;border-radius:4px;background:#fff;color:#111;font:600 12px Arial;padding:4px 8px;margin-right:6px;cursor:pointer}
#tip{position:fixed;z-index:4;pointer-events:none;background:#111;color:#fff;font-size:14px;font-weight:600;padding:4px 8px;border-radius:4px;white-space:nowrap}
#chosen{position:fixed;z-index:4;pointer-events:none;background:#111;box-shadow:inset 4px 0 0 #ff8000;padding-left:12px !important;color:#fff;font-size:14px;font-weight:600;padding:4px 8px;border-radius:4px;white-space:nowrap}
#gridwrap{position:fixed;inset:0 0 var(--barh) 0;background:rgba(40,44,48,.55);z-index:6;display:grid;place-items:center;padding:20px 56px 20px 20px;box-sizing:border-box}
#grid{width:min(100%,960px);max-height:100%;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:8px;align-content:start;padding:6px;box-sizing:border-box}
.tile{border:0;padding:0;background:#fff;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;outline:3px solid transparent;outline-offset:-3px;font:inherit}
.tile:focus-visible{outline:3px solid #111;outline-offset:2px}
.tile .pic{display:block;aspect-ratio:8/5;background:#fff}
.tile img{display:block;width:100%;height:100%;object-fit:contain}
.tile img:not([src]){visibility:hidden}
.tile .name{display:block;background:#eef2fb;padding:5px 6px;font-size:15px;color:#222;text-align:center}
.tile.active{outline-color:#f08a24}
.tile:hover .name{background:#dfe7f8}
#gridclose{position:fixed;top:18px;right:58px;width:40px;height:40px;border-radius:50%;border:0;background:#111;color:#fff;font-size:24px;line-height:1;cursor:pointer;z-index:7}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:18px;color:#555;background:#fff;z-index:9}
@media (max-width:700px){#instructions{top:46px;right:16px;max-width:none}}
@media (max-width:420px){#caption{font-size:17.2px}.caution{font-size:15.5px}}
@media (max-width:600px){:root{--barh:72px}#start{justify-content:flex-start;padding-top:64px;width:auto;right:24px}#start h1{font-size:24px}#logo{font-size:24px}#cardtext{font-size:19px}#cardbox.list #cardtext{font-size:16px}#cardbox{padding:18px 48px 18px 20px}select{font-size:16px}.rb.big{width:48px;height:48px}#bar{gap:8px;padding:0 8px}#gridwrap{padding:12px 12px 12px 12px}#gridclose{right:14px;top:58px}#partsview{padding:58px 12px 12px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>
<link rel="modulepreload" href="./vendor/three/three.module.min.js">
</head><body>
<div id="loading" role="status">Loading model…</div>
<main id="main" aria-label="Build guide">
<div id="stage"></div>
<svg id="overlay" aria-hidden="true"></svg>
<div id="start" hidden><div id="logo">TECHBOX</div><h1 id="title"></h1><h2 id="subtitle"></h2><small id="copyright"></small></div>
<div id="instructions" hidden>
  <div id="caption" hidden><p id="captiontext"></p>
    <button type="button" class="speak" id="speak" aria-pressed="false" aria-label="Read the instructions aloud" title="Read aloud"><svg class="say" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg><svg class="stop" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg></button></div>
  <div id="caution" class="caution" role="note" hidden><svg viewBox="0 0 26 24" aria-hidden="true"><path d="M13 1.5 25 22.5H1z" fill="#fbbf24" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 8.5v7" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/><circle cx="13" cy="19" r="1.5" fill="#1f2937"/></svg><p><strong>Caution: </strong><span id="cautiontext"></span></p></div>
</div>
<div id="card" hidden><div id="cardbox"><div id="cardtext"></div>
  <div id="cardcaution" class="caution" role="note" hidden><svg viewBox="0 0 26 24" aria-hidden="true"><path d="M13 1.5 25 22.5H1z" fill="#fbbf24" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 8.5v7" stroke="#1f2937" stroke-width="2.6" stroke-linecap="round"/><circle cx="13" cy="19" r="1.5" fill="#1f2937"/></svg><p><strong>Caution: </strong><span id="cardcautiontext"></span></p></div>
  <button type="button" class="speak" id="cardspeak" aria-pressed="false" aria-label="Read the card aloud" title="Read aloud"><svg class="say" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg><svg class="stop" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg></button></div></div>
<section id="partsview" aria-labelledby="partstitle" tabindex="0" hidden><h2 id="partstitle">Parts List</h2><div id="partsgroups"></div></section>
<div id="partzoom" role="dialog" aria-modal="true" aria-labelledby="partzoomname" hidden><figure><img id="partzoomimg" alt=""><figcaption id="partzoomname"></figcaption><button type="button" id="partzoomclose" aria-label="Close the picture" title="Close (Esc)">&times;</button></figure></div>
<figure id="inset" hidden><img id="insetimg" alt=""><figcaption id="insetcap"></figcaption></figure>
<div id="flag" hidden></div>
<div id="tip" hidden></div>
<div id="chosen" hidden></div>
</main>
<div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="picks" hidden>Picked points <span id="pickstate"></span><div id="picklist"></div><button id="pickcopy">Copy again</button><button id="pickclear">Clear</button></div>
<label id="review"><input type="checkbox" id="rv" checked> Review notes</label>
<button id="resetview" aria-label="Reset the view" title="Reset the view (back to this step's own view)"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1.5L7 6.5l5 5V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
<button id="fs" aria-label="Full screen" title="Full screen"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v2H6.4l4.3 4.3-1.4 1.4L5 6.4V10H3zm18 0v7h-2V6.4l-4.3 4.3-1.4-1.4L17.6 5H14V3zM3 21v-7h2v3.6l4.3-4.3 1.4 1.4L6.4 19H10v2zm18 0h-7v-2h3.6l-4.3-4.3 1.4-1.4 4.3 4.3V14h2z"/></svg></button>
<div id="gridwrap" role="dialog" aria-modal="true" aria-label="All steps" hidden><button id="gridclose" aria-label="Close the list of steps" title="Close (Esc)">&times;</button><div id="grid"></div></div>
<nav id="bar" aria-label="Steps">
  <button class="rb sm" id="first" aria-label="First step" title="First step (Home)" aria-keyshortcuts="Home"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2h2v12H2zM14 2v12L5 8z"/></svg></button>
  <button class="rb big" id="prev" aria-label="Previous step" title="Previous step (Left arrow)" aria-keyshortcuts="ArrowLeft"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M12 1v14L2 8z"/></svg></button>
  <button id="gridbtn" aria-label="All steps" title="All steps" aria-haspopup="dialog"><svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 1h6v6H1zm8 0h6v6H9zM1 9h6v6H1zm8 0h6v6H9z" fill="#222"/></svg></button>
  <select id="sel" aria-label="Go to step"></select>
  <button class="rb big" id="next" aria-label="Next step" title="Next step (Right arrow)" aria-keyshortcuts="ArrowRight"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1v14l10-7z"/></svg></button>
  <button class="rb sm" id="last" aria-label="Last step" title="Last step (End)" aria-keyshortcuts="End"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M12 2h2v12h-2zM2 2v12l9-6z"/></svg></button>
</nav>
<script>
// If the guide cannot start (no connection, a missing file), say so instead of showing "Loading" for ever.
function loadFailed() { var l = document.getElementById('loading'); if (l) l.textContent = 'This guide could not be loaded. Check your connection and reload the page.'; }
addEventListener('error', loadFailed, true); addEventListener('unhandledrejection', loadFailed);
</script>
<script type="module">import('./js/player.js?v=' + Date.now());   // (a fresh copy of the player's code on every load: no browser can keep an old one)</script>
</body></html>
