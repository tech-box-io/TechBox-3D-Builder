# Render Blueprint for the build-guide website. Render serves site/ only (the current release of each published guide, written by
# tools/publish.py); everything else in this repository stays private. THE GITHUB REPOSITORY MUST BE PRIVATE (it holds the CAD
# meshes, the guide sources and every release): never make it public or fork it publicly, give Render's GitHub App access to this
# one repository only, and use two-factor sign-in on both accounts.
#
# Render deploys the branch "live", not "main": main can be pushed at any time as a backup; a guide goes live only when
#   python3 tools/check_site.py && git push origin main:live
# is run, on Lee's word. Link the Blueprint to "live" too, so that a header change here ships with the guides it is for.
#
# After the first deploy, look at the headers:
#   for p in / /kits/mini-robot-arm /404.html /mini-robot-arm-full-build /mini-robot-arm-full-build/ /mini-robot-arm-full-build/steps.json; do
#     echo "== $p"; curl -sI "https://models.tech-box.io$p" | grep -i -E '^(HTTP|content-security-policy|x-frame-options|cache-control)'; done
# (a guide: content-security-policy: frame-ancestors https://edu.tech-box.io, and x-frame-options: DENY, which browsers ignore
# when that CSP is there; every other page: x-frame-options: DENY and no CSP;
# Cache-Control: no-cache everywhere; .js comes as a JavaScript type). Repeat over a few minutes (Render's CDN) and expect the
# same answers every time; then try a real embed from the LMS, and a frame from anywhere else, which must stay blank.
# A header deleted from this file must also be deleted in Render's dashboard (Render keeps it otherwise): change a value instead.
# Do not use the dashboard's Rollback button (it switches automatic deploys off): roll back with publish.py --restore, then push.
services:
  - type: web
    name: techbox-build-guides
    runtime: static
    branch: live
    autoDeployTrigger: commit
    buildCommand: python3 --version && python3 tools/check_site.py   # checks only (no generating on Render); a failed check keeps the last deploy live
    staticPublishPath: site
    # (no pull-request previews: a preview would put another version of a guide online)
    domains: [models.tech-box.io]
    # Before any address goes into the LMS, once models.tech-box.io is verified and working, close the onrender.com address:
    # renderSubdomainPolicy: disabled
    headers:
      # Every file is re-checked with the server each time a guide opens (a 304 "unchanged" costs almost nothing), so a new
      # release reaches the next learner who opens the guide, and there is never anything to clear or wait out.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Robots-Tag
        value: noindex
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # No other site may load the guides' files into its own pages (never add Access-Control-Allow-Origin).
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-site
      # FRAMING. No page may be shown inside another site's frame (X-Frame-Options: DENY on every path), except a guide, which
      # TechBox's LMS may frame (its own Content-Security-Policy frame-ancestors, which browsers obey instead of X-Frame-Options).
      # Never put a Content-Security-Policy on /*: when two rules with the same header name match one path, Render sends one of
      # them at random. The guides' rules below are written by tools/site_pages.py from guides.json (embed_origins); do not edit.
      - path: /*
        name: X-Frame-Options
        value: DENY
      # BEGIN guide framing
      - path: /mini-robot-arm-full-build
        name: Content-Security-Policy
        value: "frame-ancestors https://edu.tech-box.io"
      - path: /mini-robot-arm-full-build/*
        name: Content-Security-Policy
        value: "frame-ancestors https://edu.tech-box.io"
      - path: /remote-controlled-car-full-build
        name: Content-Security-Policy
        value: "frame-ancestors https://edu.tech-box.io"
      - path: /remote-controlled-car-full-build/*
        name: Content-Security-Policy
        value: "frame-ancestors https://edu.tech-box.io"
      # END guide framing
